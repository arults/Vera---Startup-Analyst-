name: Phase 1D census discovery
on:
  workflow_dispatch:
  push:
    branches: [phase-1d]
    paths:
      - 'src/phase1d/discover.py'
      - '.github/workflows/phase1d-census.yml'
concurrency:
  group: phase1d-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery dependencies
        run: |
          pip install requests beautifulsoup4 curl_cffi playwright
          python -m playwright install --with-deps chromium
      - name: Discover public platform census surfaces
        run: python src/phase1d/discover.py
      - name: Persist checkpoint outputs
        run: |
          git config user.name "vera-phase1d-bot"
          git config user.email "vera-phase1d-bot@users.noreply.github.com"
          git add data/phase1d
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Phase 1D CP1: persist source discovery manifest [skip ci]"
            git fetch origin phase-1d
            git rebase origin/phase-1d
            git push origin HEAD:phase-1d
          fi
