name: Phase 1B verifier
on:
  pull_request:
  push:
    branches: [phase-1b]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Full Phase 1B verifier
        run: python src/phase1b_verifier.py --manifest data/cohort_manifest.csv --outcomes data/outcomes.csv
