name: Phase 1D CP10 coverage and document completion
on:
  push:
    branches: [phase-1d]
    paths: [.github/workflows/phase1d-cp10-collection.yml]
permissions:
  contents: write
concurrency:
  group: phase1d-cp10-empirical
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 defusedxml pymupdf pypdf lxml
      - name: Execute actual sitemap and unfinished document collection
        run: python -m src.phase1d.capture_cp10
      - name: Full regression suite and historical scientific gates
        if: always()
        run: |
          mkdir -p evidence/phase1d_cp10
          python -m unittest discover -s tests -v > evidence/phase1d_cp10/full-tests.txt 2>&1
          python -m src.phase1d.verifier_v4 > evidence/phase1d_cp10/historical-scientific-verifier.json
          tail -5 evidence/phase1d_cp10/full-tests.txt
      - name: Verify every source hash and scope invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,gzip,hashlib
          p=Path('data/phase1d/cp10/collection-1');sha=lambda b:hashlib.sha256(b).hexdigest()
          before=json.loads((p/'preserved_before.json').read_text())
          assert all(Path(k).is_file() and sha(Path(k).read_bytes())==v for k,v in before.items())
          m=json.loads((p/'manifest.json').read_text());n=0
          for r in m:
              if r.get('source_path'):
                  b=Path(r['source_path']).read_bytes();assert sha(b)==r['gzip_sha256'];assert sha(gzip.decompress(b))==r['raw_sha256'];n+=1
          s=json.loads((p/'summary.json').read_text())
          assert s['documents']['queue_count']==106
          assert not s['phase_complete'] and not s['rates_promoted'] and not s['global_plateau']
          assert not s['sitemap']['platform_historical_census_complete']
          assert not s['documents']['semantic_review_complete']
          hist=json.loads(Path('evidence/phase1d_cp10/historical-scientific-verifier.json').read_text())
          assert hist['passed']==hist['gate_count']==43
          out={'preserved_data_files_verified':len(before),'source_payload_hashes_verified':n,'document_queue_count_verified':106,'current_sitemap_not_historical_census':True,'structural_PDF_preview_not_semantic_admission':True,'no_rates_or_false_plateau':True,'historical43_checks_passed':True}
          with open('evidence/phase1d_cp10/integrity.json','x') as f:json.dump(out,f,indent=2)
          print(out)
          PY
      - name: Commit new immutable source data and verification receipts
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/phase1d/cp10 evidence/phase1d_cp10
          if git diff --cached --name-status | grep -v '^A[[:space:]]'; then echo 'Non-additive data change refused'; exit 1; fi
          if ! git diff --cached --quiet; then
            git commit -m 'CP10: preserve actual sitemap traversal and unfinished-document recovery; no empirical promotion'
            git push origin HEAD:phase-1d
          fi
      - name: Export new metadata and PDF previews for evidence adjudication
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,subprocess,hashlib
          out=Path('/tmp/vera-cp10-collection');out.mkdir()
          files=list(Path('data/phase1d/cp10').rglob('*.json'))+list(Path('evidence/phase1d_cp10').rglob('*'))+[Path('src/phase1d/capture_cp10.py')]
          for p in files:
              if p.is_file():
                  target=out/p;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,target)
          (out/'source-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          lines=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(out)) for p in sorted(out.rglob('*')) if p.is_file()]
          (out/'SHA256SUMS').write_text('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1d-cp10-collection-${{ github.run_id }}
          path: /tmp/vera-cp10-collection/
          retention-days: 30
          if-no-files-found: error
