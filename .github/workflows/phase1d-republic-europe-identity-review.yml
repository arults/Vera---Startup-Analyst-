name: Phase 1D Republic Europe identity review
on:
  workflow_dispatch:
  push:
    branches: [phase-1d]
    paths:
      - 'src/phase1d/build_republic_europe_identity_review.py'
      - 'src/phase1d/apply_republic_europe_identity_review.py'
      - 'src/phase1d/rebuild_republic_europe_outcomes_v4.py'
      - 'src/phase1d/estimate_republic_europe_candidate_v3.py'
      - 'tests/test_phase1d_republic_europe_identity_review.py'
      - 'tests/test_phase1d_republic_europe_identity_apply.py'
      - 'tests/test_phase1d_republic_europe_outcomes_v4.py'
      - 'tests/test_phase1d_republic_europe_estimates_v3.py'
      - '.github/workflows/phase1d-republic-europe-identity-review.yml'
concurrency:
  group: phase1d-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  review_queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional recovery dependencies
        run: pip install requests curl_cffi
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
      - name: Rebuild fail-closed identity review queue
        run: python -m src.phase1d.build_republic_europe_identity_review
      - name: Apply conservative Jev review disposition
        run: python -m src.phase1d.apply_republic_europe_identity_review
      - name: Rebuild canonical outcome ledger v4
        run: python -m src.phase1d.rebuild_republic_europe_outcomes_v4
      - name: Recompute censoring-aware candidate estimates v3
        run: python -m src.phase1d.estimate_republic_europe_candidate_v3
      - name: Persist reviewed identity outcome and estimate checkpoint
        run: |
          git config user.name "vera-phase1d-bot"
          git config user.email "vera-phase1d-bot@users.noreply.github.com"
          git add data/phase1d/cp3_republic_europe_identity_review_queue.csv
          git add data/phase1d/cp3_republic_europe_identity_unmatched_after_queue.csv
          git add data/phase1d/cp3_republic_europe_identity_review_summary.json
          git add data/phase1d/cp3_republic_europe_identity_review_manifest.json
          git add data/phase1d/cp3_republic_europe_identity_review_decisions.csv
          git add data/phase1d/cp3_republic_europe_identity_matches_accepted.csv
          git add data/phase1d/cp3_republic_europe_business_observations_v2.csv
          git add data/phase1d/cp3_republic_europe_identity_review_applied_summary.json
          git add data/phase1d/cp3_republic_europe_identity_review_applied_manifest.json
          git add data/phase1d/cp3_republic_europe_outcome_ledger_v4.csv
          git add data/phase1d/cp3_republic_europe_outcome_ledger_v4_summary.json
          git add data/phase1d/cp3_republic_europe_outcome_ledger_v4_manifest.json
          git add data/phase1d/cp4_republic_europe_rq1_candidate_v3.csv
          git add data/phase1d/cp4_republic_europe_rq2_gate_v3.csv
          git add data/phase1d/cp4_republic_europe_candidate_v3_summary.json
          git add data/phase1d/cp4_republic_europe_candidate_v3_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 1D: persist canonical Republic Europe candidate estimates v3 [skip ci]"
            git fetch origin phase-1d
            git rebase origin/phase-1d
            git push origin HEAD:phase-1d
          fi
