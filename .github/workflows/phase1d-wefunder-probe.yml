name: Phase 1D Wefunder explore probe
on:
  workflow_dispatch:
  push:
    branches: [phase-1d]
    paths:
      - 'src/phase1d/probe_wefunder_explore.py'
      - '.github/workflows/phase1d-wefunder-probe.yml'
concurrency:
  group: phase1d-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture Wefunder explore API in platform browser context
        run: python src/phase1d/probe_wefunder_explore.py
      - name: Persist Wefunder probe
        run: |
          git config user.name "vera-phase1d-bot"
          git config user.email "vera-phase1d-bot@users.noreply.github.com"
          git add data/phase1d/cp1_wefunder_explore_probe.json data/phase1d/cp1_wefunder_explore_probe_summary.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Phase 1D CP1: persist Wefunder explore API probe [skip ci]"
            git fetch origin phase-1d
            git rebase origin/phase-1d
            git push origin HEAD:phase-1d
          fi
